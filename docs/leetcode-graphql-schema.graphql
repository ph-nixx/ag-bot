"""
[VERIFIED, partial] Full field list is [SOURCED] from selectProblem.ts /
dailyProblem.ts. `questionFrontendId`, `title`, `difficulty` confirmed live
via `question(titleSlug: "two-sum")`; `questionFrontendId` is a String
("1"), not a numeric type, despite the name.
"""
type Question {
  questionId: String
  questionFrontendId: String
  boundTopicId: Int
  title: String
  titleSlug: String
  content: String
  translatedTitle: String
  translatedContent: String
  isPaidOnly: Boolean
  difficulty: Difficulty
  likes: Int
  dislikes: Int
  isLiked: Boolean
  similarQuestions: String
  exampleTestcases: String
  contributors: [Contributor]
  topicTags: [TopicTag]
  companyTagStats: String
  codeSnippets: [CodeSnippet]
  stats: String
  hints: [String]
  solution: SolutionDetail
  status: String
  sampleTestCase: String
  metaData: String
  judgerAvailable: Boolean
  judgeType: String
  mysqlSchemas: [String]
  enableRunCode: Boolean
  enableTestMode: Boolean
  enableDebugger: Boolean
  envInfo: String
  libraryUrl: String
  adminUrl: String
  challengeQuestion: ChallengeQuestion
  note: String

  # Fields below only ever observed via questionList's `data` selection,
  # not via the standalone `question(titleSlug)` lookup — plausibly present
  # on both, confirmed only in the list context.
  acRate: Float
  freqBar: Float
  isFavor: Boolean
  hasSolution: Boolean
  hasVideoSolution: Boolean
}

