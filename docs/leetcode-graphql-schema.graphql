# ============================================================
# Root Query
# ============================================================

"""
Every field below is [VERIFIED or SOURCED] per its own note. Argument
requiredness (`!`) is taken directly from the operation strings that
declared them (e.g. `$username: String!`) — this part is a hard fact, not
an inference, since the operations themselves fail schema validation
otherwise.
"""
type Query {
  # --- User domain ---
  """[VERIFIED] Returns null (with error "That user does not exist.") for unknown usernames."""
  matchedUser(username: String!): MatchedUser
  """[SOURCED]"""
  allQuestionsCount: [QuestionCount]
  """[VERIFIED]"""
  recentSubmissionList(username: String!, limit: Int): [Submission]
  """[VERIFIED]"""
  recentAcSubmissionList(username: String!, limit: Int): [Submission]
  """[VERIFIED]"""
  userProfileUserQuestionProgressV2(userSlug: String!): UserQuestionProgress

  # --- Problem domain ---
  """[VERIFIED]"""
  question(titleSlug: String!): Question
  """
  [VERIFIED] `filters` must be passed explicitly (`{}` if unused) — omitting
  it entirely throws "missing 1 required positional argument: 'filters'"
  despite the argument being nullable in the operation signature.
  """
  questionList(
    categorySlug: String
    limit: Int
    skip: Int
    filters: QuestionListFilterInput
  ): QuestionListResponse
  """[SOURCED]"""
  activeDailyCodingChallengeQuestion: DailyCodingChallengeQuestion
  """[SOURCED]"""
  questionTopicTags: QuestionTagConnection

  # --- Contest domain ---
  """[SOURCED]"""
  allContests: [Contest]
  """[SOURCED]"""
  userContestRanking(username: String!): UserContestRanking
  """[SOURCED]"""
  userContestRankingHistory(username: String!): [UserContestRankingHistoryEntry]

  # --- Discussion domain ---
  """[SOURCED]"""
  topic(id: Int!): DiscussTopic
  """[SOURCED] `orderBy`/`pageNo`/`numPerPage` have server-side defaults."""
  topicComments(
    topicId: Int!
    orderBy: String = "newest_to_oldest"
    pageNo: Int = 1
    numPerPage: Int = 10
  ): TopicCommentsConnection
  """[SOURCED]"""
  cachedTrendingCategoryTopics(first: Int!): [TrendingTopic]
}

