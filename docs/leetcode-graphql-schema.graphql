# LeetCode GraphQL Schema (Reverse-Engineered, Partial)
#
# Endpoint:      POST https://leetcode.com/graphql
# Required header: Referer: https://leetcode.com
# Auth:          None of the fields below require authentication (public profile data).
#
# PROVENANCE
# This is NOT an official schema — leetcode.com/graphql has introspection disabled
# (`{ __schema { types { name } } }` returns "Query unavailable"), so there is no
# spec-sanctioned way to obtain the authoritative SDL. This file was assembled by:
#   1. Extracting every operation string from alfaarghya/alfa-leetcode-api's
#      src/GQLQueries/*.ts (https://github.com/alfaarghya/alfa-leetcode-api),
#      commit as of 2026-08-13.
#   2. Live-verifying the operations relevant to ALGO GYM (see
#      specs/001-leetcode-submission-tracking/spec.md) directly against
#      leetcode.com/graphql on 2026-08-13.
#   3. Merging duplicate/overlapping field selections (e.g. `question.solution`
#      is requested shallow in one operation and deep in another — both are the
#      same field, merged into one type here) and inferring types from live
#      response payloads where the source repo left them untyped.
#
# CONFIDENCE MARKERS
#   [VERIFIED]  — confirmed live against leetcode.com/graphql on 2026-08-13.
#   [SOURCED]   — taken from the alfa-leetcode-api operations/types.ts, not
#                 independently re-verified this session.
# Field/type presence is a lower bound, not a complete picture: any field never
# referenced by one of the source operations is simply absent from this file,
# whether or not it exists on the live schema.
#
# KNOWN GAPS
#   - No mutations. The source project is read-only and never authenticates, so
#     mutation names/shapes (submit code, run code, etc.) are entirely unknown.
#   - Input object internals are mostly unknown. `QuestionListFilterInput` is
#     [VERIFIED] to exist and to reject unknown fields with a descriptive error
#     ("In field \"x\": Unknown field."), and to require `filters: {}` be passed
#     explicitly even though the argument is nullable in the operation string —
#     but no valid field name on it has been confirmed. Treat it as opaque.
#   - No enum value lists, no deprecation info, no full field lists on any
#     type — only what these ~20 operations happened to select.
#
# INCONSISTENCIES OBSERVED (documented, not resolved)
#   - Difficulty casing differs by field. `submitStats.acSubmissionNum.difficulty`,
#     `allQuestionsCount.difficulty`, and `question.difficulty` all [VERIFIED]
#     return "Easy" | "Medium" | "Hard" | "All" (title case). But
#     `userProfileUserQuestionProgressV2.numAcceptedQuestions.difficulty`
#     [VERIFIED] returns "EASY" | "MEDIUM" | "HARD" (upper case, no "All").
#     Modeled below as two distinct enums — do not assume they're the same type.
#   - `alfa-leetcode-api`'s own hand-written types.ts declares
#     `MatchedUser.userCalendar.dccBadge` (singular), but its own
#     userProfileCalendar.ts operation queries `dccBadges` (plural). This file
#     follows the operation string (what's actually sent over the wire), not
#     the possibly-stale hand-written type.

# ============================================================
# Scalars & Enums
# ============================================================

"""
Difficulty as returned by submitStats, allQuestionsCount, and question.difficulty.
[VERIFIED] values: Easy, Medium, Hard, All (the "All" bucket appears in
submitStats/allQuestionsCount aggregates, not on individual questions).
"""
enum Difficulty {
  All
  Easy
  Medium
  Hard
}

"""
Difficulty as returned by userProfileUserQuestionProgressV2 fields only.
[VERIFIED] distinct casing from `Difficulty` above — see INCONSISTENCIES.
"""
enum DifficultyLevel {
  EASY
  MEDIUM
  HARD
}

# Many "object-shaped" fields below (stats, metaData, similarQuestions,
# companyTagStats, envInfo) are [SOURCED] as opaque JSON-encoded strings on
# the live API rather than real GraphQL object/list types. Kept as `String`.

# ============================================================
# User Domain
# ============================================================

"""A single Easy/Medium/Hard/All bucket with submission counts. [VERIFIED]"""
type SubmissionCountNode {
  difficulty: Difficulty
  count: Int
  submissions: Int
}

"""[VERIFIED] Aggregate submission stats for a user, in two equivalent shapes
observed under different field names (`submitStats` vs `submitStatsGlobal`)."""
type SubmitStatsNode {
  totalSubmissionNum: [SubmissionCountNode]
  acSubmissionNum: [SubmissionCountNode]
}

"""[SOURCED]"""
type UserDataProfile {
  realName: String
  userAvatar: String
  birthday: String
  ranking: Int
  reputation: Int
  websites: [String]
  countryName: String
  company: String
  school: String
  skillTags: [String]
  aboutMe: String
  starRating: Float
}

"""[SOURCED]"""
type Contributions {
  points: Int
  questionCount: Int
  testcaseCount: Int
}

"""[SOURCED]"""
type Badge {
  id: String
  displayName: String
  icon: String
  creationDate: String
}

"""[SOURCED] Used for `upcomingBadges` — a lighter-weight Badge projection."""
type UpcomingBadge {
  name: String
  icon: String
}

"""[SOURCED]"""
type DccBadgeEntry {
  timestamp: Int
  badge: UpcomingBadge
}

"""
[SOURCED] `submissionCalendar` is a JSON-encoded string mapping unix day
timestamps to solve counts for that day — not a structured GraphQL type.
"""
type UserCalendar {
  activeYears: [Int]
  streak: Int
  totalActiveDays: Int
  dccBadges: [DccBadgeEntry]
  submissionCalendar: String
}

"""[SOURCED]"""
type SkillStat {
  tagName: String
  tagSlug: String
  problemsSolved: Int
}

"""[SOURCED]"""
type TagProblemCounts {
  fundamental: [SkillStat]
  intermediate: [SkillStat]
  advanced: [SkillStat]
}

"""[SOURCED]"""
type LanguageProblemCount {
  languageName: String
  problemsSolved: Int
}

"""
[VERIFIED] Public LeetCode user profile. `matchedUser(username)` returns null
(with a top-level GraphQL error `"That user does not exist."`) when the
username has no matching public profile — this is the existence-check signal.
"""
type MatchedUser {
  username: String
  githubUrl: String
  twitterUrl: String
  linkedinUrl: String
  contributions: Contributions
  profile: UserDataProfile
  badges: [Badge]
  upcomingBadges: [UpcomingBadge]
  activeBadge: Badge
  submitStats: SubmitStatsNode
  submitStatsGlobal: SubmitStatsNode
  submissionCalendar: String
  userCalendar(year: Int): UserCalendar
  tagProblemCounts: TagProblemCounts
  languageProblemCount: [LanguageProblemCount]
}

"""[VERIFIED] Shared shape for recentSubmissionList and recentAcSubmissionList."""
type Submission {
  title: String
  titleSlug: String
  timestamp: String
  statusDisplay: String
  lang: String
}

"""[SOURCED]"""
type QuestionCount {
  difficulty: Difficulty
  count: Int
}

"""[VERIFIED] Per-difficulty progress buckets. See DifficultyLevel casing note."""
type DifficultyCount {
  count: Int
  difficulty: DifficultyLevel
}

"""[SOURCED]"""
type DifficultyPercentage {
  difficulty: DifficultyLevel
  percentage: Float
}

"""[VERIFIED]"""
type UserQuestionProgress {
  numAcceptedQuestions: [DifficultyCount]
  numFailedQuestions: [DifficultyCount]
  numUntouchedQuestions: [DifficultyCount]
  userSessionBeatsPercentage: [DifficultyPercentage]
}

